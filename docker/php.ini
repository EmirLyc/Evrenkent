; Railway imajı — php.ini-production'ın üstüne.
; Belge yükleme 20 MB'a kadar (DocumentController/WorkController max:20480), kapaklar 5 MB.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
expose_php = Off

; Kod imajın içinde, deploy olmadan değişmiyor — dosya değişikliği kontrolüne gerek yok.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
